<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#14151a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BR Pointage" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Blood Runners — Pointage arrivée</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🏃 Blood Runners — Pointage</h1>
  </header>

  <section id="pin-screen">
    <p>Entrez le code bénévole pour activer le scanner.</p>
    <input id="pin-input" type="password" inputmode="numeric" placeholder="Code bénévole" autocomplete="off" />
    <button id="pin-submit">Valider</button>
    <p id="pin-error" class="error" hidden>Code incorrect.</p>
  </section>

  <section id="scan-screen" hidden>
    <div id="reader"></div>
    <button id="torch-btn" class="ghost" hidden>🔦 Activer le flash</button>

    <div id="manual-entry">
      <p>Ou saisir le numéro de dossard :</p>
      <div class="manual-row">
        <input id="manual-input" type="text" inputmode="numeric" placeholder="Ex. 12" autocomplete="off" />
        <button id="manual-submit">Valider</button>
      </div>
    </div>

    <p id="stats">Dossards enregistrés cette session : <span id="count">0</span></p>
  </section>

  <div id="result-modal" class="modal-overlay hidden">
    <div id="result-modal-content" class="modal-content loading">
      <div id="modal-spinner" class="spinner"></div>
      <p id="modal-message">Identification en cours…</p>
      <button id="modal-btn" hidden></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
