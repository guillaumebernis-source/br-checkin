<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#14151a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="BR Pointage" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Blood Runners — Émargement</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🏃 Blood Runners — Émargement</h1>
    <button id="menu-btn" class="icon-btn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" hidden>
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <nav id="menu" hidden>
      <button class="menu-item active" data-view="scan">Émargement arrivée</button>
      <button class="menu-item" data-view="depart">Émargement départ</button>
      <button class="menu-item" data-view="remaining">Coureurs toujours en course</button>
      <button class="menu-item" data-view="dns">Non partant</button>
    </nav>
  </header>

  <section id="pin-screen">
    <p>Entrez le code bénévole pour activer le scanner.</p>
    <div class="pin-field">
      <input id="pin-input" type="password" placeholder="Code bénévole" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" />
      <button id="pin-toggle" type="button" class="ghost" aria-label="Afficher le code" aria-pressed="false">Afficher</button>
    </div>
    <button id="pin-submit">Entrer</button>
    <p id="pin-error" class="error" role="alert" hidden></p>
  </section>

  <section id="scan-screen" hidden>
    <div id="dns-warning" class="warning-banner" role="alert" hidden>⚠️ Attention : flash pour les non-partants</div>
    <div id="reader"></div>
    <button id="torch-btn" class="ghost" hidden>🔦 Activer le flash</button>

    <div id="manual-entry">
      <p>Ou saisir le numéro de dossard :</p>
      <div class="manual-row">
        <input id="manual-input" type="text" inputmode="numeric" placeholder="Ex. 12" autocomplete="off" />
        <button id="manual-submit">Valider</button>
      </div>
    </div>

    <p id="stats"><span id="stats-label">Dossards enregistrés cette session :</span> <span id="count">0</span></p>
  </section>

  <section id="remaining-screen" hidden>
    <div class="stat-card">
      <div id="remaining-count" class="stat-number">…</div>
      <div id="remaining-label" class="stat-label">coureurs toujours en course</div>
      <div id="remaining-detail" class="stat-detail"></div>
    </div>
    <p id="remaining-error" class="error" hidden></p>
    <div class="remaining-actions">
      <button id="list-btn">Voir la liste des coureurs</button>
      <button id="refresh-btn" class="ghost">↻ Actualiser</button>
    </div>
    <ul id="runner-list" hidden></ul>
  </section>

  <section id="depart-screen" hidden>
    <input id="depart-search" type="search" inputmode="search" placeholder="Chargement de la liste…" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="search" disabled />
    <p id="depart-status" class="depart-status" aria-live="polite"></p>
    <div id="depart-card" class="bib-card" role="status" hidden>
      <div class="bib-label">Dossard n°</div>
      <div id="depart-bib" class="bib-number"></div>
      <div id="depart-name" class="bib-name"></div>
    </div>
    <ul id="depart-results" hidden></ul>
    <button id="depart-retry" class="ghost" hidden>↻ Réessayer</button>
  </section>

  <div id="result-modal" class="modal-overlay hidden">
    <div id="result-modal-content" class="modal-content loading">
      <div id="modal-spinner" class="spinner"></div>
      <p id="modal-message">Identification en cours…</p>
      <button id="modal-btn" hidden></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
